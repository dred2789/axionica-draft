# Install inside nginx's http context (conf.d or sites-enabled).
# HTTP bootstrap; Certbot adds HTTPS on the server after DNS is ready.
map $uri $axionica_cache_control {
    default "no-cache";
    "~^/assets/.*\.[a-f0-9]{16}\." "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name axionica.ru;

    root /var/www/axionica/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    autoindex off;
    etag on;

    types {
        text/html html;
        text/css css;
        text/plain txt;
        text/xml xml;
        application/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
        image/avif avif;
        image/gif gif;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $axionica_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/manifest+json image/svg+xml;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = / {
        return 301 /ru/$is_args$args;
    }
    location = /index.html {
        return 301 /ru/$is_args$args;
    }
    location = /ru {
        return 301 /ru/$is_args$args;
    }
    location = /en {
        return 301 /en/$is_args$args;
    }
    location = /ru/ {
        try_files /ru/index.html =404;
    }
    location = /en/ {
        try_files /en/index.html =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Reject hidden files before the public asset locations below.
    location ~ /\. {
        return 404;
    }
    location ~ ^/(ru|en)/[a-z0-9-]+\.html$ {
        try_files $uri =404;
    }
    location ~ ^/assets/[a-zA-Z0-9_./-]+\.(?:css|js|svg|jpg|jpeg|png|webp|avif|gif|ico|woff|woff2)$ {
        try_files $uri =404;
    }
    location = /robots.txt {
        try_files $uri =404;
    }
    location = /sitemap.xml {
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
    }
    # No SPA fallback: missing pages and private files must be real 404s.
    location / {
        return 404;
    }
}
