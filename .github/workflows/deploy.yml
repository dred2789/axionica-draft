name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    env:
      DEPLOY_PATH: /var/www/axionica
      DEPLOY_RELEASE: incoming-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Test build and release switching
        run: |
          sh -n deploy/release.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test real nginx and build hashed static files
        run: python3 tests/nginx_smoke.py

      - name: Package public files only
        run: tar -C dist --exclude=.axionica-build -czf website.tar.gz .

      - name: Prepare release directory
        id: prepare_server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_RELEASE
          script: |
            set -eu
            mkdir -p "$DEPLOY_PATH/$DEPLOY_RELEASE"
            chmod 755 "$DEPLOY_PATH" "$DEPLOY_PATH/$DEPLOY_RELEASE"

      - name: Upload website
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: website.tar.gz
          target: /var/www/axionica/${{ env.DEPLOY_RELEASE }}

      - name: Atomically activate release and remove old releases
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: DEPLOY_PATH,DEPLOY_RELEASE
          script_path: deploy/release.sh

      - name: Remove failed upload
        if: ${{ always() && steps.prepare_server.outcome == 'success' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_RELEASE
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            if [ "$(readlink current || true)" != "$DEPLOY_RELEASE" ]; then
              rm -rf -- "./$DEPLOY_RELEASE"
            fi

      - name: Check public HTTPS
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 https://axionica.ru/ru/ -o /tmp/axionica-live.html
          cmp dist/ru/index.html /tmp/axionica-live.html
          curl --fail --silent --show-error --max-time 30 https://axionica.ru/en/ -o /dev/null
