    <circle cx="148" cy="120" r="18" fill="#171b1f" fill-opacity=".08" stroke="#171b1f" stroke-opacity=".16"/>
    <path d="M88 166h78M88 184h52" stroke="#171b1f" stroke-opacity=".28" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M206 142h88" stroke="#0066ff" stroke-width="4" stroke-linecap="round"/>
  <path d="m280 126 18 16-18 16" fill="none" stroke="#0066ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="318" y="54" width="220" height="188" rx="10" fill="#fff" stroke="#171b1f" stroke-opacity=".14"/>
    <rect x="318" y="54" width="220" height="38" rx="10" fill="url(#blue)"/>
    <path d="M318 84h220" stroke="#003f9e" stroke-opacity=".3"/>
    <rect x="346" y="118" width="76" height="72" rx="7" fill="#f1f4f7" stroke="#171b1f" stroke-opacity=".12"/>
    <rect x="442" y="118" width="68" height="24" rx="5" fill="#f1f4f7" stroke="#171b1f" stroke-opacity=".12"/>
    <rect x="442" y="158" width="68" height="32" rx="5" fill="#eaf7f1" stroke="#18885f" stroke-opacity=".25"/>
    <path d="M360 170c15-25 29-31 44-18" fill="none" stroke="#18885f" stroke-width="5" stroke-linecap="round"/>
    <path d="M356 206h154" stroke="#171b1f" stroke-opacity=".18" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M554 142h78" stroke="#18885f" stroke-width="4" stroke-linecap="round"/>
  <path d="m618 126 18 16-18 16" fill="none" stroke="#18885f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="652" y="84" width="44" height="142" rx="8" fill="#fff" stroke="#171b1f" stroke-opacity=".14"/>
    <rect x="666" y="174" width="16" height="32" rx="4" fill="url(#green)"/>
    <rect x="666" y="136" width="16" height="28" rx="4" fill="#0066ff"/>
    <rect x="666" y="104" width="16" height="22" rx="4" fill="#171b1f" fill-opacity=".18"/>
  </g>

