<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Product and economics workflow illustration</title>
  <desc id="desc">A structured product workflow moving from an initial idea through a digital product interface to business metrics.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#e1e8ef"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0066ff"/>
      <stop offset="1" stop-color="#003f9e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ca873"/>
      <stop offset="1" stop-color="#18885f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#171b1f" flood-opacity=".12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="64" y="78" width="126" height="126" rx="8" fill="#fff" stroke="#171b1f" stroke-opacity=".14"/>
